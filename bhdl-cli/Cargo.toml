[package]
name = "bhdl-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
bhdl-parser = { path = "../bhdl-parser" }
bhdl-ast = { path = "../bhdl-ast" }
bhdl-analyzer = { path = "../bhdl-analyzer" }
bhdl-synthesizer = { path = "../bhdl-synthesizer" }
bhdl-netlist = { path = "../bhdl-netlist" }
bhdl-visualizer = { path = "../bhdl-visualizer" }
bhdl-spice = { path = "../bhdl-spice" }
bhdl-components = { path = "../bhdl-components" }
bhdl-common = { path = "../bhdl-common" }
bhdl-testbench = { path = "../bhdl-testbench" }
bhdl-sim = { path = "../bhdl-sim" }

# CLI dependencies
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
serde_json = "1.0"
colored = "2.0"

# Async runtime
tokio = { version = "1.35", features = ["rt", "macros", "fs"] }

[[bin]]
name = "test_analyzer"
path = "src/bin/test_analyzer.rs"

[[bin]]
name = "test_synthesizer"
path = "src/bin/test_synthesizer.rs"

[[bin]]
name = "test_visualizer"
path = "src/bin/test_visualizer.rs"

[[bin]]
name = "debug_connection"
path = "src/bin/debug_connection.rs"
