[package]
name = "bhdl-cli"
license.workspace = true
version = "0.1.0"
edition = "2021"

[dependencies]
bhdl-parser = { path = "../bhdl-parser" }
bhdl-ast = { path = "../bhdl-ast" }
bhdl-analyzer = { path = "../bhdl-analyzer" }
bhdl-synthesizer = { path = "../bhdl-synthesizer" }
bhdl-netlist = { path = "../bhdl-netlist" }
bhdl-schematic = { path = "../bhdl-schematic" }
bhdl-spice = { path = "../bhdl-spice" }
bhdl-components = { path = "../bhdl-components" }
bhdl-common = { path = "../bhdl-common" }
humantime = "2"
bhdl-pnr = { path = "../bhdl-pnr" }
bhdl-testbench = { path = "../bhdl-testbench" }
bhdl-sim = { path = "../bhdl-sim" }

# CLI dependencies
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
serde_json = "1.0"
# yansi (MIT) replaces colored (MPL-2.0) — zero-copyleft graph; the
# detect features reproduce colored's pipe-safe behavior (no ANSI when
# not a tty / NO_COLOR set), which the test suite's greps rely on.
yansi = { version = "1.0", features = ["detect-tty", "detect-env"] }

# Async runtime
tokio = { version = "1.35", features = ["rt", "macros", "fs"] }

[[bin]]
name = "test_analyzer"
path = "src/bin/test_analyzer.rs"

