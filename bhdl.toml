# Project manifest for the bhdl corpus itself: boards under tests/
# import test-support entities through the `corpus-support` library
# (e.g. test_model_import_demo's cross-file §5 regulator). The root
# is corpus-support/ — NOT tests/ — so growing the corpus never drifts
# the lock hash. Only declared libraries resolve; bhdl-stdlib implicit.
[project]
name = "bhdl-corpus"

[libraries]
corpus-support = { version = "0.1.0", path = "corpus-support" }
