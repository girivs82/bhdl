<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="white"/>
  
  <!-- Mark the pin positions calculated by debug -->
  <circle cx="250" cy="80" r="3" fill="red"/><!-- VIN.PWR -->
  <circle cx="250" cy="150" r="3" fill="blue"/><!-- C_IN.1 -->
  <circle cx="365" cy="150" r="3" fill="green"/><!-- U1.VIN -->
  <circle cx="435" cy="150" r="3" fill="orange"/><!-- U1.VOUT -->
  <circle cx="550" cy="150" r="3" fill="purple"/><!-- C_OUT.1 -->
  <circle cx="550" cy="80" r="3" fill="brown"/><!-- VOUT.PWR -->
  
  <!-- The actual routing lines from SVG -->
  <line x1="250" y1="80" x2="250" y2="150" stroke="black" stroke-width="1.5"/>
  <line x1="250" y1="150" x2="365" y2="150" stroke="black" stroke-width="1.5"/>
  <line x1="435" y1="150" x2="550" y2="150" stroke="black" stroke-width="1.5"/>
  <line x1="550" y1="150" x2="550" y2="80" stroke="black" stroke-width="1.5"/>
  
  <!-- Labels -->
  <text x="250" y="75" text-anchor="middle" fill="red">VIN.PWR(250,80)</text>
  <text x="250" y="145" text-anchor="middle" fill="blue">C_IN.1(250,150)</text>
  <text x="365" y="145" text-anchor="middle" fill="green">U1.VIN(365,150)</text>
  <text x="435" y="145" text-anchor="middle" fill="orange">U1.VOUT(435,150)</text>
  <text x="550" y="145" text-anchor="middle" fill="purple">C_OUT.1(550,150)</text>
  <text x="550" y="75" text-anchor="middle" fill="brown">VOUT.PWR(550,80)</text>
  
</svg> 