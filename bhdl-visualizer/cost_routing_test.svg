<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="20" font-family="Arial" font-size="16" font-weight="bold">LDO Schematic - Cost-Based Routing (Dynamic)</text>
  <g id="components">
    <!-- VIN Power -->
    <g transform="translate(50.0,50.0)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="white" stroke="black" stroke-width="2"/>
      <text x="0" y="2" text-anchor="middle" font-family="Arial" font-size="8" fill="black">+</text>
      <text x="15" y="-8" font-family="Arial" font-size="10" fill="black">VIN</text>
    </g>
    <!-- C_IN -->
    <g transform="translate(50.0,120.0)">
      <!-- Capacitor symbol rotated 90 degrees -->
      <g transform="rotate(90)">
        <line x1="-3" y1="-12" x2="-3" y2="12" stroke="black" stroke-width="2"/>
        <line x1="3" y1="-12" x2="3" y2="12" stroke="black" stroke-width="2"/>
        <line x1="-20" y1="0" x2="-3" y2="0" stroke="black" stroke-width="1"/>
        <line x1="3" y1="0" x2="20" y2="0" stroke="black" stroke-width="1"/>
      </g>
      <!-- Label positioned inline with component center but clear of symbol -->
      <text x="-30.0" y="3" text-anchor="middle" font-family="Arial" font-size="10" fill="black">C_IN</text>
    </g>
    <!-- U1 LDO -->
    <g transform="translate(200.0,100.0)">
      <rect x="-62.5" y="-48.8" width="125.0" height="97.5" fill="white" stroke="black" stroke-width="2" rx="3"/>
      <text x="0" y="-3" text-anchor="middle" font-family="Arial" font-size="10" fill="black">U1</text>
      <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="8" fill="gray">LDO</text>
      <!-- VIN pin -->
      <line x1="-72.5" y1="0" x2="-62.5" y2="0" stroke="black" stroke-width="1"/>
      <text x="-55.8" y="0.0" text-anchor="start" font-family="Arial" font-size="12" fill="gray">VIN</text>
      <!-- VOUT pin -->
      <line x1="62.5" y1="0" x2="72.5" y2="0" stroke="black" stroke-width="1"/>
      <text x="55.8" y="0.0" text-anchor="end" font-family="Arial" font-size="12" fill="gray">VOUT</text>
      <!-- GND pin -->
      <line x1="0" y1="48.8" x2="0" y2="58.8" stroke="black" stroke-width="1"/>
      <text x="0" y="42.0" text-anchor="middle" font-family="Arial" font-size="12" fill="gray">GND</text>
      <!-- EN pin -->
      <line x1="0" y1="-48.8" x2="0" y2="-58.8" stroke="black" stroke-width="1"/>
      <text x="0" y="-36.0" text-anchor="middle" font-family="Arial" font-size="12" fill="gray">EN</text>
    </g>
    <!-- C_OUT -->
    <g transform="translate(350.0,120.0)">
      <!-- Capacitor symbol rotated 90 degrees -->
      <g transform="rotate(90)">
        <line x1="-3" y1="-12" x2="-3" y2="12" stroke="black" stroke-width="2"/>
        <line x1="3" y1="-12" x2="3" y2="12" stroke="black" stroke-width="2"/>
        <line x1="-20" y1="0" x2="-3" y2="0" stroke="black" stroke-width="1"/>
        <line x1="3" y1="0" x2="20" y2="0" stroke="black" stroke-width="1"/>
      </g>
      <!-- Label positioned inline with component center but clear of symbol -->
      <text x="30.0" y="3" text-anchor="middle" font-family="Arial" font-size="10" fill="black">C_OUT</text>
    </g>
    <!-- VOUT Power -->
    <g transform="translate(450.0,50.0)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="white" stroke="black" stroke-width="2"/>
      <text x="0" y="2" text-anchor="middle" font-family="Arial" font-size="8" fill="black">+</text>
      <text x="15" y="-8" font-family="Arial" font-size="10" fill="black">VOUT</text>
    </g>
    <!-- Ground -->
    <g transform="translate(200.0,190.0)">
      <line x1="0" y1="-10" x2="0" y2="0" stroke="black" stroke-width="2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="black" stroke-width="3"/>
      <line x1="-5" y1="3" x2="5" y2="3" stroke="black" stroke-width="2"/>
      <line x1="-2" y1="6" x2="2" y2="6" stroke="black" stroke-width="1"/>
      <text x="15" y="0" font-family="Arial" font-size="10" fill="black">GND</text>
    </g>
  </g>
  <g id="routes">
    <!-- MST-optimized route: VIN.PWR → C_IN.1 (cost 30.0) -->
    <!-- MST-optimized route: C_IN.1 → U1.VIN (cost 60.0) -->
    <!-- MST-optimized route: U1.VIN → U1.EN (cost 113.0) -->
    <!-- MST-optimized route: U1.VOUT → C_OUT.1 (cost 70.0) -->
    <!-- MST-optimized route: C_OUT.1 → VOUT.PWR (cost 122.0) -->
    <!-- MST-optimized route: C_IN.2 → U1.GND (cost 140.4) -->
    <!-- MST-optimized route: U1.GND → GND.GND (cost 30.0) -->
    <!-- MST-optimized route: U1.GND → C_OUT.2 (cost 140.4) -->
    <!-- VIN_NET: MST-optimized connections -->
    <line x1="50.0" y1="60.0" x2="50.0" y2="100.0" stroke="black" stroke-width="1.5"/>
    <line x1="50.0" y1="100.0" x2="127.5" y2="100.0" stroke="black" stroke-width="1.5"/>
    <circle cx="50.0" cy="100.0" r="2" fill="black"/>
    <line x1="127.5" y1="100.0" x2="127.5" y2="41.2" stroke="black" stroke-width="1.5"/>
    <line x1="127.5" y1="41.2" x2="200.0" y2="41.2" stroke="black" stroke-width="1.5"/>
    <circle cx="127.5" cy="100.0" r="2" fill="black"/>
    <!-- VOUT_NET: MST-optimized connections -->
    <line x1="272.5" y1="100.0" x2="350.0" y2="100.0" stroke="black" stroke-width="1.5"/>
    <line x1="350.0" y1="100.0" x2="450.0" y2="100.0" stroke="black" stroke-width="1.5"/>
    <line x1="450.0" y1="100.0" x2="450.0" y2="60.0" stroke="black" stroke-width="1.5"/>
    <circle cx="350.0" cy="100.0" r="2" fill="black"/>
    <!-- GND_NET: MST-optimized star topology -->
    <line x1="50.0" y1="140.0" x2="50.0" y2="165.0" stroke="black" stroke-width="1.5"/>
    <line x1="50.0" y1="165.0" x2="200.0" y2="165.0" stroke="black" stroke-width="1.5"/>
    <line x1="200.0" y1="158.8" x2="200.0" y2="165.0" stroke="black" stroke-width="1.5"/>
    <line x1="350.0" y1="140.0" x2="350.0" y2="165.0" stroke="black" stroke-width="1.5"/>
    <line x1="350.0" y1="165.0" x2="200.0" y2="165.0" stroke="black" stroke-width="1.5"/>
    <line x1="200.0" y1="165.0" x2="200.0" y2="190.0" stroke="black" stroke-width="1.5"/>
    <circle cx="200.0" cy="165.0" r="2.5" fill="black"/>
  </g>
  <g id="legend">
    <text x="420.0" y="320.0" font-family="Arial" font-size="12" font-weight="bold">Routing Info</text>
    <text x="420.0" y="335.0" font-family="Arial" font-size="10">Total Cost: 705.7</text>
    <text x="420.0" y="348.0" font-family="Arial" font-size="10">Junction dots at wire meets</text>
    <text x="420.0" y="360.0" font-family="Arial" font-size="9">All connections in black</text>
  </g>
</svg>