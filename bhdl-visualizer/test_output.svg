<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f8f8f8" stroke="#dddddd" stroke-width="1"/>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
<path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
</pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)"/>
  <g id="GND" transform="translate(400,400) rotate(0)">\n\<line x1="0" y1="-10" x2="0" y2="0" stroke="black" stroke-width="2"/>\n\<line x1="-8" y1="0" x2="8" y2="0" stroke="black" stroke-width="3"/>\n\<line x1="-5" y1="3" x2="5" y2="3" stroke="black" stroke-width="2"/>\n\<line x1="-2" y1="6" x2="2" y2="6" stroke="black" stroke-width="1"/>\n\<text x="12" y="0" text-anchor="start" font-family="Arial" font-size="10" fill="black">GND</text>\n\</g>
  <g id="VOUT" transform="translate(460,220) rotate(0)">\n\<line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2"/>\n\<circle cx="0" cy="0" r="6" fill="white" stroke="black" stroke-width="2"/>\n\<text x="0" y="-2" text-anchor="middle" font-family="Arial" font-size="8" fill="black">+</text>\n\<text x="12" y="0" text-anchor="start" font-family="Arial" font-size="10" fill="black">VOUT</text>\n\</g>
  <g id="VIN" transform="translate(340,220) rotate(0)">\n\<line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2"/>\n\<circle cx="0" cy="0" r="6" fill="white" stroke="black" stroke-width="2"/>\n\<text x="0" y="-2" text-anchor="middle" font-family="Arial" font-size="8" fill="black">+</text>\n\<text x="12" y="0" text-anchor="start" font-family="Arial" font-size="10" fill="black">VIN</text>\n\</g>
  <g id="C_OUT" transform="translate(460,320) rotate(90)">\n\<line x1="-3" y1="-12" x2="-3" y2="12" stroke="black" stroke-width="2"/>\n\<line x1="3" y1="-12" x2="3" y2="12" stroke="black" stroke-width="2"/>\n\<line x1="-20" y1="0" x2="-3" y2="0" stroke="black" stroke-width="1"/>\n\<line x1="3" y1="0" x2="20" y2="0" stroke="black" stroke-width="1"/>\n\<text x="8" y="0" text-anchor="start" font-family="Arial" font-size="10" fill="black">C_OUT</text>\n\</g>
  <g id="U1" transform="translate(400,300) rotate(0)">\n\<rect x="-25" y="-15" width="50" height="30" fill="white" stroke="black" stroke-width="2" rx="3"/>\n\<text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="10" fill="black">U1</text>\n\<text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="8" fill="gray">LDO</text>\n\<!-- VIN pin -->\n\<line x1="-35" y1="0" x2="-25" y2="0" stroke="black" stroke-width="1"/>\n\<text x="-30" y="-3" text-anchor="middle" font-family="Arial" font-size="8" fill="gray">VIN</text>\n\<!-- VOUT pin -->\n\<line x1="25" y1="0" x2="35" y2="0" stroke="black" stroke-width="1"/>\n\<text x="30" y="-3" text-anchor="middle" font-family="Arial" font-size="8" fill="gray">VOUT</text>\n\<!-- GND pin -->\n\<line x1="0" y1="15" x2="0" y2="25" stroke="black" stroke-width="1"/>\n\<text x="5" y="20" text-anchor="start" font-family="Arial" font-size="8" fill="gray">GND</text>\n\<!-- EN pin -->\n\<line x1="0" y1="-15" x2="0" y2="-25" stroke="black" stroke-width="1"/>\n\<text x="5" y="-18" text-anchor="start" font-family="Arial" font-size="8" fill="gray">EN</text>\n\</g>
  <g id="C_IN" transform="translate(340,320) rotate(90)">\n\<line x1="-3" y1="-12" x2="-3" y2="12" stroke="black" stroke-width="2"/>\n\<line x1="3" y1="-12" x2="3" y2="12" stroke="black" stroke-width="2"/>\n\<line x1="-20" y1="0" x2="-3" y2="0" stroke="black" stroke-width="1"/>\n\<line x1="3" y1="0" x2="20" y2="0" stroke="black" stroke-width="1"/>\n\<text x="8" y="0" text-anchor="start" font-family="Arial" font-size="10" fill="black">C_IN</text>\n\</g>
  <line x1="340" y1="230" x2="340" y2="300" stroke="black" stroke-width="1.5"/>
  <line x1="340" y1="300" x2="365" y2="300" stroke="black" stroke-width="1.5"/>
