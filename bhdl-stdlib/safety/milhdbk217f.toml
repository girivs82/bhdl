# MIL-HDBK-217F (Notice 2, 28 Feb 1995) coefficient table for the bhdl
# reliability engine (docs/spec/Functional_Safety.md §2.8).
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ REAL DATA — MIL-HDBK-217F is a US government work in the public │
# │ domain, so its constants ship in-repo (the one standard that    │
# │ can). Every row cites its handbook section and page; the        │
# │ transcription is unit-tested against the handbook's own printed │
# │ λ_b tables (bhdl-synthesizer/src/reliability.rs).               │
# │                                                                 │
# │ Honesty note: 217F is dated (1995) and pessimistic for modern   │
# │ parts; automotive assessors typically expect SN 29500 or        │
# │ IEC 62380. Treat this as the shipped, fully-sourced DEFAULT —   │
# │ override per project with your licensed standard's constants in │
# │ a gitignored <std>.local.toml overlay.                          │
# └─────────────────────────────────────────────────────────────────┘
#
# Model (part stress, §9): λ_p = λ_b·π_R·π_Q·π_E failures/10⁶h,
# FIT = 1000·λ_p, with
#   λ_b = a · exp(b·((T+273)/nt)^p) · exp((S/g)·((T+273)/ns))
# T = mission ambient °C, S = sim-derived stress ratio (never guessed),
# π_R from the part's resistance, π_Q from mission `quality`
# (default "lower" = COTS), π_E from mission `environment` (default GB).
# Environment symbols per Table 3-2: GB ground benign, GF ground fixed,
# GM ground mobile, NS naval sheltered, NU naval unsheltered, AIC/AIF
# airborne inhabited, AUC/AUF airborne uninhabited, ARW rotary wing,
# SF space flight, MF missile flight, ML missile launch, CL cannon.

standard = "MILHDBK217F"
source = "MIL-HDBK-217F Notice 2 (28 Feb 1995), Section 9 — public domain (US government work); everyspec.com copy"

# §9.2 Resistors, Fixed, Film — RL (MIL-R-22684) / RLR (MIL-R-39017).
# The default class for generic film resistors.
[classes.res_fixed_film]
model = "mil217f_resistor"
a = 3.25e-4     # λ_b = 3.25e-4·exp(((T+273)/343)^3)·exp(S·((T+273)/273))   §9.2 p.9-3
b = 1.0
nt = 343.0
p = 3.0
g = 1.0
ns = 273.0
pi_r = [[1e5, 1.0], [1e6, 1.1], [1e7, 1.6], [1e30, 2.5]]   # §9.2 p.9-4 (<0.1M / 0.1–1M / 1–10M / >10M)
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 5.0, lower = 15.0 }   # §9.2 p.9-4 (mil_spec = MIL-R-10509/22684 non-ER)
pi_e = { GB = 1.0, GF = 2.0, GM = 8.0, NS = 4.0, NU = 14.0, AIC = 4.0, AIF = 8.0, AUC = 10.0, AUF = 18.0, ARW = 19.0, SF = 0.2, MF = 10.0, ML = 28.0, CL = 510.0 }   # §9.2 p.9-4
source = "MIL-HDBK-217F N2 §9.2 (RL MIL-R-22684 / RLR MIL-R-39017), p.9-3/9-4"

# §9.2 Resistors, Fixed, Film, high stability — RN (MIL-R-10509/55182).
[classes.res_fixed_film_rn]
model = "mil217f_resistor"
a = 5.0e-5      # λ_b = 5e-5·exp(3.5·((T+273)/398))·exp(S·((T+273)/273))     §9.2 p.9-3
b = 3.5
nt = 398.0
p = 1.0
g = 1.0
ns = 273.0
pi_r = [[1e5, 1.0], [1e6, 1.1], [1e7, 1.6], [1e30, 2.5]]   # §9.2 p.9-4
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 5.0, lower = 15.0 }   # §9.2 p.9-4
pi_e = { GB = 1.0, GF = 2.0, GM = 8.0, NS = 4.0, NU = 14.0, AIC = 4.0, AIF = 8.0, AUC = 10.0, AUF = 18.0, ARW = 19.0, SF = 0.2, MF = 10.0, ML = 28.0, CL = 510.0 }   # §9.2 p.9-4
source = "MIL-HDBK-217F N2 §9.2 (RN MIL-R-10509/55182), p.9-3/9-4"

# §9.3 Resistors, Fixed, Film, POWER — RD (MIL-R-11804).
# λ_b = 7.33e-3·exp(0.202·((T+273)/298)^2.6)·exp(((S/1.45)·((T+273)/273))^1.3)
# — the closed form VERIFIED against the handbook's printed λ_b grid:
# λ_b(0°C,S=.1)=.0089, λ_b(200°C,S=.1)=.015, λ_b(0°C,S=.9)=.015 (p.9-5).
[classes.res_fixed_film_power]
model = "mil217f_resistor"
a = 7.33e-3
b = 0.202
nt = 298.0
p = 2.6
g = 1.45
ns = 273.0
h = 1.3
pi_r = [[100.0, 1.0], [1e5, 1.2], [1e6, 1.3], [1e30, 3.5]]   # §9.3 p.9-5 (10–100 / >100–100K / >100K–1M / >1M)
pi_q = { mil_spec = 1.0, lower = 3.0 }                        # §9.3 p.9-5
pi_e = { GB = 1.0, GF = 2.0, GM = 10.0, NS = 5.0, NU = 17.0, AIC = 6.0, AIF = 8.0, AUC = 14.0, AUF = 18.0, ARW = 25.0, SF = 0.5, MF = 14.0, ML = 36.0, CL = 660.0 }   # §9.3 p.9-5
source = "MIL-HDBK-217F N2 §9.3 (RD MIL-R-11804), p.9-5"

# §9.4 Resistors, NETWORK, Fixed, Film — RZ (MIL-R-83401).
# λ_p = 0.00006·π_T·π_NR·π_Q·π_E; T_C = T_A + 55·S (handbook estimate);
# π_T = exp(4074·(1/298 − 1/(T_C+273))) — fit VERIFIED against the
# printed grid: π_T(50°C)=2.9, π_T(75°C)=7.1, π_T(125°C)=31 (p.9-6).
# π_NR = number of film resistors IN USE (`n_resistors` attribute;
# unused elements are not counted — the handbook's own note).
[classes.res_network_film]
model = "mil217f_resnetwork"
lambda = 0.00006
t_b = 4074.0
pi_q = { mil_spec = 1.0, lower = 3.0 }                        # §9.4 p.9-6
pi_e = { GB = 1.0, GF = 2.0, GM = 8.0, NS = 4.0, NU = 14.0, AIC = 4.0, AIF = 8.0, AUC = 9.0, AUF = 18.0, ARW = 19.0, SF = 0.5, MF = 14.0, ML = 28.0, CL = 510.0 }   # §9.4 p.9-6
source = "MIL-HDBK-217F N2 §9.4 (RZ MIL-R-83401), p.9-6"

# §9.1 Resistors, Fixed, Composition — RC (MIL-R-11) / RCR (MIL-R-39008).
[classes.res_fixed_composition]
model = "mil217f_resistor"
a = 4.5e-9      # λ_b = 4.5e-9·exp(12·((T+273)/343))·exp((S/0.6)·((T+273)/273))   §9.1 p.9-2
b = 12.0
nt = 343.0
p = 1.0
g = 0.6
ns = 273.0
pi_r = [[1e5, 1.0], [1e6, 1.1], [1e7, 1.6], [1e30, 2.5]]   # §9.1 p.9-2
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 5.0, lower = 15.0 }   # §9.1 p.9-2 (mil_spec = MIL-R-11)
pi_e = { GB = 1.0, GF = 3.0, GM = 8.0, NS = 5.0, NU = 13.0, AIC = 4.0, AIF = 5.0, AUC = 7.0, AUF = 11.0, ARW = 19.0, SF = 0.5, MF = 11.0, ML = 27.0, CL = 490.0 }   # §9.1 p.9-2
source = "MIL-HDBK-217F N2 §9.1 (RC MIL-R-11 / RCR MIL-R-39008), p.9-2"

# ── Capacitors (§10) ──────────────────────────────────────────────────
# Model: λ_p = λ_b·π_CV·[π_SR]·π_Q·π_E failures/10⁶h, FIT = 1000·λ_p,
#   λ_b = a·[(S/g)³+1]·exp(b·((T+273)/nt)^p),  S = applied/rated VOLTAGE
#   (sum of DC + peak AC per the handbook), π_CV = cv_a·C^cv_exp.

# §10.11 Ceramic, temperature compensating and CHIP (MLCC) — CDR
# (MIL-C-55681, all styles; the 125°C-max-rated model). The default
# class for generic ceramic capacitors.
[classes.cap_ceramic_chip]
model = "mil217f_capacitor"
a = 2.6e-9      # λ_b = 2.6e-9·[(S/.3)³+1]·exp(14.3·(T+273)/398)   §10.11 p.10-20
g = 0.3
b = 14.3
nt = 398.0
p = 1.0
cv_a = 0.59     # π_CV = 0.59·C^0.12, C in pF                       §10.11 p.10-20
cv_exp = 0.12
cv_unit = "pF"
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 3.0, lower = 10.0 }   # §10.11 p.10-20 (mil_spec = non-ER)
pi_e = { GB = 1.0, GF = 2.0, GM = 10.0, NS = 5.0, NU = 17.0, AIC = 4.0, AIF = 8.0, AUC = 16.0, AUF = 35.0, ARW = 24.0, SF = 0.5, MF = 13.0, ML = 34.0, CL = 610.0 }   # §10.11 p.10-20
source = "MIL-HDBK-217F N2 §10.11 (CDR MIL-C-55681, 125°C-rated model), p.10-20"

# §10.10 Ceramic, general purpose — CK (MIL-C-11015) / CKR
# (MIL-C-39014); the 125°C-max-rated (type B) model.
[classes.cap_ceramic_gp]
model = "mil217f_capacitor"
a = 3.0e-4      # λ_b = 0.0003·[(S/.3)³+1]·exp((T+273)/398)         §10.10 p.10-18
g = 0.3
b = 1.0
nt = 398.0
p = 1.0
cv_a = 0.41     # π_CV = 0.41·C^0.11, C in pF                       §10.10 p.10-19
cv_exp = 0.11
cv_unit = "pF"
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, L = 3.0, mil_spec = 3.0, lower = 10.0 }   # §10.10 p.10-19 (mil_spec = MIL-C-11015 non-ER)
pi_e = { GB = 1.0, GF = 2.0, GM = 9.0, NS = 5.0, NU = 15.0, AIC = 4.0, AIF = 4.0, AUC = 8.0, AUF = 12.0, ARW = 20.0, SF = 0.4, MF = 13.0, ML = 34.0, CL = 610.0 }   # §10.10 p.10-19
source = "MIL-HDBK-217F N2 §10.10 (CK MIL-C-11015 / CKR MIL-C-39014, 125°C type B model), p.10-18/10-19"

# §10.12 Tantalum, solid electrolyte — CSR (MIL-C-39003). Uses the
# series-resistance factor π_SR (circuit Ω per applied volt): rows are
# [min_CR, π_SR], first row whose min is below the circuit CR applies.
# The circuit CR is not yet sim-derived — an instance without
# cr_ohms_per_volt gets FIT_UNCOMPUTED, never a guessed π_SR.
[classes.cap_tantalum_solid]
model = "mil217f_capacitor"
a = 3.75e-3     # λ_b = .00375·[(S/.4)³+1]·exp(2.6·((T+273)/398)^9)   §10.12 p.10-21
g = 0.4
b = 2.6
nt = 398.0
p = 9.0
cv_a = 1.0      # π_CV = 1.0·C^0.12, C in µF                          §10.12 p.10-21
cv_exp = 0.12
cv_unit = "uF"
pi_sr = [[0.8, 0.066], [0.6, 0.10], [0.4, 0.13], [0.2, 0.20], [0.1, 0.27], [0.0, 0.33]]   # §10.12 p.10-21
pi_q = { D = 0.001, C = 0.01, S = 0.03, B = 0.03, R = 0.1, P = 0.3, M = 1.0, L = 1.5, lower = 10.0 }   # §10.12 p.10-21
pi_e = { GB = 1.0, GF = 2.0, GM = 8.0, NS = 5.0, NU = 14.0, AIC = 4.0, AIF = 5.0, AUC = 12.0, AUF = 20.0, ARW = 24.0, SF = 0.4, MF = 11.0, ML = 29.0, CL = 530.0 }   # §10.12 p.10-21
source = "MIL-HDBK-217F N2 §10.12 (CSR MIL-C-39003), p.10-21"

# ── Discrete semiconductors (§6) ─────────────────────────────────────
# Model: λ_p = λ_b·π_T·π_A·π_R·π_S·π_C·π_Q·π_E failures/10⁶h,
# FIT = 1000·λ_p; π_T = exp(−t_const·(1/(T_J+273) − 1/298)) with
# T_J = T_ambient + θ_JA·P (P sim-derived; θ_JA from the instance's
# theta_ja attribute — absent ⇒ FIT_UNCOMPUTED, never a guessed θ).
# COTS default quality = "plastic" (the handbook's own category).

# §6.1 diode, general purpose analog.
[classes.diode_gp]
model = "mil217f_semiconductor"
lambda_b = 0.0038   # §6.1 p.6-2
t_const = 3091.0    # π_T group: gp/switching/fast/rectifier/TVS   §6.1 p.6-2
pi_s_mode = "diode" # .054 (Vs≤.3) else Vs^2.43 (reverse-V ratio)  §6.1 p.6-3
pi_a = 1.0
pi_c = 1.0          # metallurgically bonded                        §6.1 p.6-3
pi_q = { JANTXV = 0.7, JANTX = 1.0, JAN = 2.4, lower = 5.5, plastic = 8.0 }   # §6.1 p.6-3
default_quality = "plastic"
pi_e = { GB = 1.0, GF = 6.0, GM = 9.0, NS = 9.0, NU = 19.0, AIC = 13.0, AIF = 29.0, AUC = 20.0, AUF = 43.0, ARW = 24.0, SF = 0.5, MF = 14.0, ML = 32.0, CL = 320.0 }   # §6.1 p.6-3
source = "MIL-HDBK-217F N2 §6.1 (general purpose analog), p.6-2/6-3"

# §6.1 diode, switching.
[classes.diode_switching]
model = "mil217f_semiconductor"
lambda_b = 0.0010   # §6.1 p.6-2
t_const = 3091.0
pi_s_mode = "diode"
pi_a = 1.0
pi_c = 1.0
pi_q = { JANTXV = 0.7, JANTX = 1.0, JAN = 2.4, lower = 5.5, plastic = 8.0 }
default_quality = "plastic"
pi_e = { GB = 1.0, GF = 6.0, GM = 9.0, NS = 9.0, NU = 19.0, AIC = 13.0, AIF = 29.0, AUC = 20.0, AUF = 43.0, ARW = 24.0, SF = 0.5, MF = 14.0, ML = 32.0, CL = 320.0 }
source = "MIL-HDBK-217F N2 §6.1 (switching), p.6-2/6-3"

# §6.1 transient suppressor / varistor (π_S = 1 by the handbook).
[classes.diode_tvs]
model = "mil217f_semiconductor"
lambda_b = 0.0013   # §6.1 p.6-2
t_const = 3091.0
pi_s_mode = "one"   # TVS/vreg/vref/current-reg: π_S = 1            §6.1 p.6-3
pi_a = 1.0
pi_c = 1.0
pi_q = { JANTXV = 0.7, JANTX = 1.0, JAN = 2.4, lower = 5.5, plastic = 8.0 }
default_quality = "plastic"
pi_e = { GB = 1.0, GF = 6.0, GM = 9.0, NS = 9.0, NU = 19.0, AIC = 13.0, AIF = 29.0, AUC = 20.0, AUF = 43.0, ARW = 24.0, SF = 0.5, MF = 14.0, ML = 32.0, CL = 320.0 }
source = "MIL-HDBK-217F N2 §6.1 (transient suppressor/varistor), p.6-2/6-3"

# §6.1 voltage regulator / voltage reference (avalanche and zener).
[classes.diode_vreg_vref]
model = "mil217f_semiconductor"
lambda_b = 0.0020   # §6.1 p.6-2
t_const = 1925.0    # π_T group: vreg/vref/current-reg              §6.1 p.6-2
pi_s_mode = "one"
pi_a = 1.0
pi_c = 1.0
pi_q = { JANTXV = 0.7, JANTX = 1.0, JAN = 2.4, lower = 5.5, plastic = 8.0 }
default_quality = "plastic"
pi_e = { GB = 1.0, GF = 6.0, GM = 9.0, NS = 9.0, NU = 19.0, AIC = 13.0, AIF = 29.0, AUC = 20.0, AUF = 43.0, ARW = 24.0, SF = 0.5, MF = 14.0, ML = 32.0, CL = 320.0 }
source = "MIL-HDBK-217F N2 §6.1 (voltage regulator/reference), p.6-2/6-3"

# §6.3 bipolar transistor, NPN/PNP, SWITCHING application (π_A = .70;
# a linear-amplification stage uses bjt_npn_pnp_linear).
[classes.bjt_npn_pnp]
model = "mil217f_semiconductor"
lambda_b = 0.00074  # §6.3 p.6-6
t_const = 2114.0
pi_s_mode = "bjt"   # π_S = .045·e^{3.1·Vs}, Vs = VCE/VCEO          §6.3 p.6-7
pi_a = 0.70         # switching                                     §6.3 p.6-6
pi_r_mode = "bjt"   # π_R = .43 (≤.1W) else Pr^.37                  §6.3 p.6-6
pi_q = { JANTXV = 0.7, JANTX = 1.0, JAN = 2.4, lower = 5.5, plastic = 8.0 }   # §6.3 p.6-7
default_quality = "plastic"
pi_e = { GB = 1.0, GF = 6.0, GM = 9.0, NS = 9.0, NU = 19.0, AIC = 13.0, AIF = 29.0, AUC = 20.0, AUF = 43.0, ARW = 24.0, SF = 0.5, MF = 14.0, ML = 32.0, CL = 320.0 }   # §6.3 p.6-7
source = "MIL-HDBK-217F N2 §6.3 (NPN/PNP, switching π_A=.70), p.6-6/6-7"

[classes.bjt_npn_pnp_linear]
model = "mil217f_semiconductor"
lambda_b = 0.00074
t_const = 2114.0
pi_s_mode = "bjt"
pi_a = 1.5          # linear amplification                          §6.3 p.6-6
pi_r_mode = "bjt"
pi_q = { JANTXV = 0.7, JANTX = 1.0, JAN = 2.4, lower = 5.5, plastic = 8.0 }
default_quality = "plastic"
pi_e = { GB = 1.0, GF = 6.0, GM = 9.0, NS = 9.0, NU = 19.0, AIC = 13.0, AIF = 29.0, AUC = 20.0, AUF = 43.0, ARW = 24.0, SF = 0.5, MF = 14.0, ML = 32.0, CL = 320.0 }
source = "MIL-HDBK-217F N2 §6.3 (NPN/PNP, linear π_A=1.5), p.6-6/6-7"

# §6.4 Si FET, MOSFET, small-signal switching (π_A = .70). Power FETs
# (Pr ≥ 2W non-linear) carry larger π_A — see §6.4 p.6-8 (2.0/4.0/8.0/10
# by rated power) and declare a dedicated class when needed.
[classes.fet_mosfet]
model = "mil217f_semiconductor"
lambda_b = 0.012    # §6.4 p.6-8
t_const = 1925.0
pi_s_mode = "one"   # no π_S in the §6.4 model
pi_a = 0.70         # small-signal switching                        §6.4 p.6-8
pi_q = { JANTXV = 0.7, JANTX = 1.0, JAN = 2.4, lower = 5.5, plastic = 8.0 }   # §6.4 p.6-8
default_quality = "plastic"
pi_e = { GB = 1.0, GF = 6.0, GM = 9.0, NS = 9.0, NU = 19.0, AIC = 13.0, AIF = 29.0, AUC = 20.0, AUF = 43.0, ARW = 24.0, SF = 0.5, MF = 14.0, ML = 32.0, CL = 320.0 }   # §6.4 p.6-8
source = "MIL-HDBK-217F N2 §6.4 (MOSFET, small-signal switching π_A=.70), p.6-8"

[classes.fet_jfet]
model = "mil217f_semiconductor"
lambda_b = 0.0045   # §6.4 p.6-8
t_const = 1925.0
pi_s_mode = "one"
pi_a = 0.70
pi_q = { JANTXV = 0.7, JANTX = 1.0, JAN = 2.4, lower = 5.5, plastic = 8.0 }
default_quality = "plastic"
pi_e = { GB = 1.0, GF = 6.0, GM = 9.0, NS = 9.0, NU = 19.0, AIC = 13.0, AIF = 29.0, AUC = 20.0, AUF = 43.0, ARW = 24.0, SF = 0.5, MF = 14.0, ML = 32.0, CL = 320.0 }
source = "MIL-HDBK-217F N2 §6.4 (JFET), p.6-8"

# ── Inductive devices (§11) ──────────────────────────────────────────
# Model: λ_p = λ_b·π_C·π_Q·π_E, λ_b = a·exp(((T_HS+273)/nt)^p) with the
# hot spot T_HS = T_A + 1.1·ΔT (§11.3); ΔT comes from the instance's
# temp_rise attribute (or the base spec's temperature-rise test) —
# absent ⇒ FIT_UNCOMPUTED, never a guessed rise.

# §11.2 fixed RF coil / inductor, insulation class B (125°C) model —
# the generic default for molded inductors.
[classes.coil_fixed]
model = "mil217f_inductive"
a = 0.000319        # λ_b = .000319·exp(((T_HS+273)/364)^8.7)       §11.2 p.11-3 (class B)
nt = 364.0
p = 8.7
pi_c = 1.0          # fixed                                          §11.2 p.11-3
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 4.0, lower = 20.0 }   # §11.2 p.11-3 (mil_spec = MIL-C-15305)
default_quality = "lower"
pi_e = { GB = 1.0, GF = 4.0, GM = 12.0, NS = 5.0, NU = 16.0, AIC = 5.0, AIF = 7.0, AUC = 6.0, AUF = 8.0, ARW = 24.0, SF = 0.5, MF = 13.0, ML = 34.0, CL = 610.0 }   # §11.2 p.11-4
source = "MIL-HDBK-217F N2 §11.2 (fixed coil, insulation class B model), p.11-3/11-4"

# §11.1 power transformer / filter, insulation class S (130°C) model.
[classes.xfmr_power]
model = "mil217f_inductive"
a = 0.0018          # λ_b = .0018·exp(((T_HS+273)/364)^8.7)          §11.1 p.11-1 (class S/130°C)
nt = 364.0
p = 8.7
pi_q = { mil_spec = 8.0, lower = 30.0 }   # power transformers & filters   §11.1 p.11-2
default_quality = "lower"
pi_e = { GB = 1.0, GF = 6.0, GM = 12.0, NS = 5.0, NU = 16.0, AIC = 6.0, AIF = 8.0, AUC = 7.0, AUF = 9.0, ARW = 24.0, SF = 0.5, MF = 13.0, ML = 34.0, CL = 610.0 }   # §11.1 p.11-2
source = "MIL-HDBK-217F N2 §11.1 (power transformer/filter, insulation class S 130°C model), p.11-1/11-2"
