# MIL-HDBK-217F (Notice 2, 28 Feb 1995) coefficient table for the bhdl
# reliability engine (docs/spec/Functional_Safety.md §2.8).
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ REAL DATA — MIL-HDBK-217F is a US government work in the public │
# │ domain, so its constants ship in-repo (the one standard that    │
# │ can). Every row cites its handbook section and page; the        │
# │ transcription is unit-tested against the handbook's own printed │
# │ λ_b tables (bhdl-synthesizer/src/reliability.rs).               │
# │                                                                 │
# │ Honesty note: 217F is dated (1995) and pessimistic for modern   │
# │ parts; automotive assessors typically expect SN 29500 or        │
# │ IEC 62380. Treat this as the shipped, fully-sourced DEFAULT —   │
# │ override per project with your licensed standard's constants in │
# │ a gitignored <std>.local.toml overlay.                          │
# └─────────────────────────────────────────────────────────────────┘
#
# Model (part stress, §9): λ_p = λ_b·π_R·π_Q·π_E failures/10⁶h,
# FIT = 1000·λ_p, with
#   λ_b = a · exp(b·((T+273)/nt)^p) · exp((S/g)·((T+273)/ns))
# T = mission ambient °C, S = sim-derived stress ratio (never guessed),
# π_R from the part's resistance, π_Q from mission `quality`
# (default "lower" = COTS), π_E from mission `environment` (default GB).
# Environment symbols per Table 3-2: GB ground benign, GF ground fixed,
# GM ground mobile, NS naval sheltered, NU naval unsheltered, AIC/AIF
# airborne inhabited, AUC/AUF airborne uninhabited, ARW rotary wing,
# SF space flight, MF missile flight, ML missile launch, CL cannon.

standard = "MILHDBK217F"
source = "MIL-HDBK-217F Notice 2 (28 Feb 1995), Section 9 — public domain (US government work); everyspec.com copy"

# §9.2 Resistors, Fixed, Film — RL (MIL-R-22684) / RLR (MIL-R-39017).
# The default class for generic film resistors.
[classes.res_fixed_film]
model = "mil217f_resistor"
a = 3.25e-4     # λ_b = 3.25e-4·exp(((T+273)/343)^3)·exp(S·((T+273)/273))   §9.2 p.9-3
b = 1.0
nt = 343.0
p = 3.0
g = 1.0
ns = 273.0
pi_r = [[1e5, 1.0], [1e6, 1.1], [1e7, 1.6], [1e30, 2.5]]   # §9.2 p.9-4 (<0.1M / 0.1–1M / 1–10M / >10M)
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 5.0, lower = 15.0 }   # §9.2 p.9-4 (mil_spec = MIL-R-10509/22684 non-ER)
pi_e = { GB = 1.0, GF = 2.0, GM = 8.0, NS = 4.0, NU = 14.0, AIC = 4.0, AIF = 8.0, AUC = 10.0, AUF = 18.0, ARW = 19.0, SF = 0.2, MF = 10.0, ML = 28.0, CL = 510.0 }   # §9.2 p.9-4
source = "MIL-HDBK-217F N2 §9.2 (RL MIL-R-22684 / RLR MIL-R-39017), p.9-3/9-4"

# §9.2 Resistors, Fixed, Film, high stability — RN (MIL-R-10509/55182).
[classes.res_fixed_film_rn]
model = "mil217f_resistor"
a = 5.0e-5      # λ_b = 5e-5·exp(3.5·((T+273)/398))·exp(S·((T+273)/273))     §9.2 p.9-3
b = 3.5
nt = 398.0
p = 1.0
g = 1.0
ns = 273.0
pi_r = [[1e5, 1.0], [1e6, 1.1], [1e7, 1.6], [1e30, 2.5]]   # §9.2 p.9-4
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 5.0, lower = 15.0 }   # §9.2 p.9-4
pi_e = { GB = 1.0, GF = 2.0, GM = 8.0, NS = 4.0, NU = 14.0, AIC = 4.0, AIF = 8.0, AUC = 10.0, AUF = 18.0, ARW = 19.0, SF = 0.2, MF = 10.0, ML = 28.0, CL = 510.0 }   # §9.2 p.9-4
source = "MIL-HDBK-217F N2 §9.2 (RN MIL-R-10509/55182), p.9-3/9-4"

# §9.1 Resistors, Fixed, Composition — RC (MIL-R-11) / RCR (MIL-R-39008).
[classes.res_fixed_composition]
model = "mil217f_resistor"
a = 4.5e-9      # λ_b = 4.5e-9·exp(12·((T+273)/343))·exp((S/0.6)·((T+273)/273))   §9.1 p.9-2
b = 12.0
nt = 343.0
p = 1.0
g = 0.6
ns = 273.0
pi_r = [[1e5, 1.0], [1e6, 1.1], [1e7, 1.6], [1e30, 2.5]]   # §9.1 p.9-2
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 5.0, lower = 15.0 }   # §9.1 p.9-2 (mil_spec = MIL-R-11)
pi_e = { GB = 1.0, GF = 3.0, GM = 8.0, NS = 5.0, NU = 13.0, AIC = 4.0, AIF = 5.0, AUC = 7.0, AUF = 11.0, ARW = 19.0, SF = 0.5, MF = 11.0, ML = 27.0, CL = 490.0 }   # §9.1 p.9-2
source = "MIL-HDBK-217F N2 §9.1 (RC MIL-R-11 / RCR MIL-R-39008), p.9-2"

# ── Capacitors (§10) ──────────────────────────────────────────────────
# Model: λ_p = λ_b·π_CV·[π_SR]·π_Q·π_E failures/10⁶h, FIT = 1000·λ_p,
#   λ_b = a·[(S/g)³+1]·exp(b·((T+273)/nt)^p),  S = applied/rated VOLTAGE
#   (sum of DC + peak AC per the handbook), π_CV = cv_a·C^cv_exp.

# §10.11 Ceramic, temperature compensating and CHIP (MLCC) — CDR
# (MIL-C-55681, all styles; the 125°C-max-rated model). The default
# class for generic ceramic capacitors.
[classes.cap_ceramic_chip]
model = "mil217f_capacitor"
a = 2.6e-9      # λ_b = 2.6e-9·[(S/.3)³+1]·exp(14.3·(T+273)/398)   §10.11 p.10-20
g = 0.3
b = 14.3
nt = 398.0
p = 1.0
cv_a = 0.59     # π_CV = 0.59·C^0.12, C in pF                       §10.11 p.10-20
cv_exp = 0.12
cv_unit = "pF"
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, mil_spec = 3.0, lower = 10.0 }   # §10.11 p.10-20 (mil_spec = non-ER)
pi_e = { GB = 1.0, GF = 2.0, GM = 10.0, NS = 5.0, NU = 17.0, AIC = 4.0, AIF = 8.0, AUC = 16.0, AUF = 35.0, ARW = 24.0, SF = 0.5, MF = 13.0, ML = 34.0, CL = 610.0 }   # §10.11 p.10-20
source = "MIL-HDBK-217F N2 §10.11 (CDR MIL-C-55681, 125°C-rated model), p.10-20"

# §10.10 Ceramic, general purpose — CK (MIL-C-11015) / CKR
# (MIL-C-39014); the 125°C-max-rated (type B) model.
[classes.cap_ceramic_gp]
model = "mil217f_capacitor"
a = 3.0e-4      # λ_b = 0.0003·[(S/.3)³+1]·exp((T+273)/398)         §10.10 p.10-18
g = 0.3
b = 1.0
nt = 398.0
p = 1.0
cv_a = 0.41     # π_CV = 0.41·C^0.11, C in pF                       §10.10 p.10-19
cv_exp = 0.11
cv_unit = "pF"
pi_q = { S = 0.03, R = 0.1, P = 0.3, M = 1.0, L = 3.0, mil_spec = 3.0, lower = 10.0 }   # §10.10 p.10-19 (mil_spec = MIL-C-11015 non-ER)
pi_e = { GB = 1.0, GF = 2.0, GM = 9.0, NS = 5.0, NU = 15.0, AIC = 4.0, AIF = 4.0, AUC = 8.0, AUF = 12.0, ARW = 20.0, SF = 0.4, MF = 13.0, ML = 34.0, CL = 610.0 }   # §10.10 p.10-19
source = "MIL-HDBK-217F N2 §10.10 (CK MIL-C-11015 / CKR MIL-C-39014, 125°C type B model), p.10-18/10-19"

# §10.12 Tantalum, solid electrolyte — CSR (MIL-C-39003). Uses the
# series-resistance factor π_SR (circuit Ω per applied volt): rows are
# [min_CR, π_SR], first row whose min is below the circuit CR applies.
# The circuit CR is not yet sim-derived — an instance without
# cr_ohms_per_volt gets FIT_UNCOMPUTED, never a guessed π_SR.
[classes.cap_tantalum_solid]
model = "mil217f_capacitor"
a = 3.75e-3     # λ_b = .00375·[(S/.4)³+1]·exp(2.6·((T+273)/398)^9)   §10.12 p.10-21
g = 0.4
b = 2.6
nt = 398.0
p = 9.0
cv_a = 1.0      # π_CV = 1.0·C^0.12, C in µF                          §10.12 p.10-21
cv_exp = 0.12
cv_unit = "uF"
pi_sr = [[0.8, 0.066], [0.6, 0.10], [0.4, 0.13], [0.2, 0.20], [0.1, 0.27], [0.0, 0.33]]   # §10.12 p.10-21
pi_q = { D = 0.001, C = 0.01, S = 0.03, B = 0.03, R = 0.1, P = 0.3, M = 1.0, L = 1.5, lower = 10.0 }   # §10.12 p.10-21
pi_e = { GB = 1.0, GF = 2.0, GM = 8.0, NS = 5.0, NU = 14.0, AIC = 4.0, AIF = 5.0, AUC = 12.0, AUF = 20.0, ARW = 24.0, SF = 0.4, MF = 11.0, ML = 29.0, CL = 530.0 }   # §10.12 p.10-21
source = "MIL-HDBK-217F N2 §10.12 (CSR MIL-C-39003), p.10-21"
