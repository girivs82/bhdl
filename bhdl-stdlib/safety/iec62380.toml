# IEC TR 62380:2004 coefficient table for the bhdl reliability engine
# (docs/spec/Functional_Safety.md §2.8).
#
# Class keys follow the standard's own taxonomy (section numbers from
# the IEC TR 62380:2004 table of contents; the constants live on the
# cited pages of the licensed document):
#
#   Resistors and potentiometers (§11, IEC 60115)
#     res_film_low_dissipation   §11.1  fixed, low dissipation film — high
#                                       stability (rs), general purpose (rc),
#                                       "minimelf"                       p.65
#     res_carbon_comp            §11.2  hot molded carbon composition    p.66
#     res_film_high_dissipation  §11.3  fixed, high dissipation film     p.67
#     res_wirewound_low          §11.4  low dissipation wirewound        p.68
#     res_wirewound_high         §11.5  high dissipation wirewound       p.69
#     res_smd_array              §11.6  fixed, low dissipation surface
#                                       mounting resistors + arrays      p.70
#     pot_cermet                 §11.7  non-wirewound cermet pot         p.71
#
#   Capacitors and thermistors (§10)
#     cap_plastic_paper          §10.1  fixed plastic/paper dielectric   p.55
#     cap_ceramic_class1         §10.2  ceramic, defined tempco, Class I p.56
#     cap_ceramic_class2         §10.3  ceramic, non-defined tempco,
#                                       Class II                         p.57
#     cap_tantalum_solid         §10.4  tantalum, solid electrolyte      p.58
#     cap_alu_nonsolid           §10.5  aluminum, non-solid electrolyte  p.59
#     cap_alu_solid              §10.6  aluminum, solid electrolyte      p.61
#     cap_alu_polymer            §10.7  aluminum, polymer electrolyte    p.62
#     ntc_thermistor             §10.9  NTC thermistor                   p.64
#
#   Inductive components (§12, IEC 61248)
#     inductor_transformer       §12    inductors and transformers       p.73
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ FIXTURE — the one live row below carries ILLUSTRATIVE numbers   │
# │ that only exercise the pipeline; they are NOT transcribed from  │
# │ the standard. Standards data is NOT redistributable: put your   │
# │ real transcription in `iec62380.local.toml` next to this file   │
# │ (gitignored, takes precedence) or in `$BHDL_SAFETY_TABLES/` —   │
# │ never in this committed file. To activate a class there: copy   │
# │ its commented stub, fill the constants from the licensed        │
# │ IEC TR 62380:2004 (or your Isograph RWB configuration), set     │
# │ `source` to the section. A class absent from the loaded table   │
# │ does not exist to the engine — FIT_UNCOMPUTED, never a guess.   │
# └─────────────────────────────────────────────────────────────────┘
#
# Engine model shape (see bhdl-synthesizer/src/reliability.rs):
#   λ = λ_base · π_T · π_S
#   π_T = exp(Ea/k · (1/T_ref − 1/T_amb))       (temperatures in K)
#   π_S = (S / S_ref)^n,  S = applied/rated (sim-derived, never guessed)
# If the transcribed §11/§10 formulas differ from this shape (62380
# resistor models add an internal-temperature step from dissipated power
# and a thermal-cycling term), extend the engine to the exact form when
# the constants land — the mission profile already carries `cycles`.

standard = "IEC62380"
source = "IEC TR 62380:2004 taxonomy; constants FIXTURE — real values NOT yet transcribed"

# §11.1 — fixed, low dissipation film (rs/rc/minimelf).  FIXTURE ROW:
# every number is illustrative, present only so the pipeline runs
# end-to-end (tests/circuits/realistic/test_safety_fit_divider.bhdl).
[classes.res_film_low_dissipation]
model = "arrhenius_stress"
lambda_base = 0.1   # FIT at reference conditions — FIXTURE
ea_ev = 0.15        # activation energy, eV — FIXTURE
t_ref_c = 40.0      # reference ambient, °C — FIXTURE
s_ref = 0.5         # reference stress ratio — FIXTURE
stress_exp = 1.0    # stress exponent — FIXTURE
source = "FIXTURE (shape only) — replace with IEC TR 62380:2004 §11.1, p.65"

