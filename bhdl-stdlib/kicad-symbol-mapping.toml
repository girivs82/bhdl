# ─── USB connectors ───────────────────────────────────────────────
# USB-C receptacle (USB 2.0, 16-pad variant). Pad names map
# identity-style: KiCad pin "A1" → entity pin "A1", etc.

[[mapping]]
kicad = "Connector:USB_C_Receptacle_USB2.0_16P"
bhdl  = "USB_C_Receptacle_USB2_16P"

# ─── Test points ───────────────────────────────────────────────────

[[mapping]]
kicad = "Connector:TestPoint"
bhdl  = "TestPoint"
# No pin_map — TestPoint is currently aliased to
# `kicad_passthrough` which has 1..64 numeric pins. The previous
# `pin_map = { "1" = "K" }` translated to a pin that doesn't
# exist, causing TP.K to fail materialisation on the BHDL side
# while the KiCad-side canonical still saw TP.K. Two diffs per
# TestPoint on Arduino Nano (TP1, TP2). When a real TestPoint
# entity ships with a `K` (or `pad`) port, restore the pin_map.

[[mapping]]
kicad = "Connector:TestPoint_2Pin"
bhdl  = "TestPoint"

# ─── Power flags (handled specially) ───────────────────────────────
# These aren't instantiable components — the importer treats them
# as net-naming hints that synthesise `power`/`ground` declarations.

[[mapping]]
kicad = "power:GND"
bhdl  = "_net:GND"

[[mapping]]
kicad = "power:Earth"
bhdl  = "_net:GND"

[[mapping]]
kicad = "power:+5V"
bhdl  = "_net:VCC_5V"

[[mapping]]
