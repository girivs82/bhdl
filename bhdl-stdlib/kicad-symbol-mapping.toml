# KiCad → BHDL symbol mapping registry.
#
# Phase B/G of the KiCad-to-BHDL translator (see
# docs/plan/KiCad_Import_And_Stdlib_Accretion.md). Each `[mapping]`
# block tells the importer: when you see a `(symbol (lib_id "X:Y") ...)`
# in a KiCad schematic, instantiate the named BHDL entity instead,
# and bind the schematic pins to the BHDL entity pins via the
# `pin_map`.
#
# Discipline:
#   - Only list mappings whose `bhdl` target is a real entity
#     already in `bhdl-stdlib`. Mappings to non-existent entities
#     produce un-parseable .bhdl on import.
#   - When stdlib gains a new entity (e.g. a generic Connector
#     family), add the relevant KiCad lib_ids in the same commit.
#   - Unmapped symbols fall through to `kicad_passthrough` (defined
#     in `bhdl-stdlib/kicad_passthrough.bhdl`); the import never
#     fails outright on an unknown part.
#
# `pin_map` translates KiCad pin numbers → BHDL port names. When
# the BHDL entity declares numeric pins (`pin 1:`, `pin 2:`), the
# default identity mapping is correct and pin_map can be omitted.
#
# Power-flag symbols (`power:GND`, `power:+5V`, …) use the
# special `_net:<NAME>` target form, meaning "this isn't an entity,
# it names a power net at this point in the schematic". The
# importer recognises the prefix and produces `power VCC_5V = 5V;`
# / `ground GND;` declarations rather than entity instances.

# ─── Passives (Device library) ─────────────────────────────────────
# All resolve to existing entities in bhdl-stdlib/passives/. KiCad
# pin numbers 1/2 line up with BHDL's pin 1/pin 2 declarations.

[[mapping]]
kicad = "Device:R"
bhdl  = "Resistor"

[[mapping]]
kicad = "Device:R_Small"
bhdl  = "Resistor"

[[mapping]]
kicad = "Device:R_US"
bhdl  = "Resistor"

[[mapping]]
kicad = "Device:C"
bhdl  = "Capacitor"

[[mapping]]
kicad = "Device:C_Small"
bhdl  = "Capacitor"

[[mapping]]
kicad = "Device:C_Polarized"
bhdl  = "Capacitor"

[[mapping]]
kicad = "Device:L"
bhdl  = "Inductor"

[[mapping]]
kicad = "Device:L_Small"
bhdl  = "Inductor"

[[mapping]]
kicad = "Device:LED"
bhdl  = "LED"
pin_map = { "1" = "K", "2" = "A" }

[[mapping]]
kicad = "Device:LED_Small"
bhdl  = "LED"
pin_map = { "1" = "K", "2" = "A" }

[[mapping]]
kicad = "Device:D"
bhdl  = "Diode"

[[mapping]]
kicad = "Device:D_Small"
bhdl  = "Diode"

[[mapping]]
kicad = "Device:Fuse"
bhdl  = "Fuse"

[[mapping]]
kicad = "Device:Polyfuse"
bhdl  = "Fuse"

# Ferrite bead: KiCad ships two spellings of the lib_id depending
# on which library is loaded (`Ferrite_Bead` in older libraries,
# `FerriteBead` in current KiCad 8). Map both to the same entity.
[[mapping]]
kicad = "Device:FerriteBead"
bhdl  = "Bead"

[[mapping]]
kicad = "Device:Ferrite_Bead"
bhdl  = "Bead"

# ─── Protection diodes ─────────────────────────────────────────────

[[mapping]]
kicad = "Diode:1.5KE6V8CA"
bhdl  = "TVSDiode"

[[mapping]]
kicad = "Diode:SMAJ5.0CA"
bhdl  = "TVSDiode"

[[mapping]]
kicad = "Diode:SS34"
bhdl  = "SchottkyDiode"

[[mapping]]
kicad = "Device:D_Schottky"
bhdl  = "SchottkyDiode"

[[mapping]]
kicad = "Device:D_Schottky_Small"
bhdl  = "SchottkyDiode"

# ─── Transistors ───────────────────────────────────────────────────
# BHDL's MOSFET entity takes a `part` string parameter; the
# importer passes the KiCad Value field through, so N vs P channel
# information rides on the part number (e.g. "BSS138", "AO3401").
# All G/D/S pin permutations KiCad uses map to the same entity —
# the entity itself uses datasheet pin names.

[[mapping]]
kicad = "Device:Q_NMOS_GDS"
bhdl  = "MOSFET"
pin_map = { "1" = "G", "2" = "D", "3" = "S" }

[[mapping]]
kicad = "Device:Q_NMOS_DGS"
bhdl  = "MOSFET"
pin_map = { "1" = "D", "2" = "G", "3" = "S" }

[[mapping]]
kicad = "Device:Q_NMOS_GSD"
bhdl  = "MOSFET"
pin_map = { "1" = "G", "2" = "S", "3" = "D" }

[[mapping]]
kicad = "Device:Q_PMOS_GDS"
bhdl  = "MOSFET"
pin_map = { "1" = "G", "2" = "D", "3" = "S" }

[[mapping]]
kicad = "Device:Q_PMOS_DGS"
bhdl  = "MOSFET"
pin_map = { "1" = "D", "2" = "G", "3" = "S" }

[[mapping]]
kicad = "Device:Q_PMOS_GSD"
bhdl  = "MOSFET"
pin_map = { "1" = "G", "2" = "S", "3" = "D" }

# Similarly for BJTs (BHDL entity uses datasheet pin names B/C/E
# and `part` carries the actual transistor model number).

[[mapping]]
kicad = "Device:Q_NPN_BCE"
bhdl  = "BJT"
pin_map = { "1" = "B", "2" = "C", "3" = "E" }

[[mapping]]
kicad = "Device:Q_NPN_BEC"
bhdl  = "BJT"
pin_map = { "1" = "B", "2" = "E", "3" = "C" }

[[mapping]]
kicad = "Device:Q_NPN_CBE"
bhdl  = "BJT"
pin_map = { "1" = "C", "2" = "B", "3" = "E" }

[[mapping]]
kicad = "Device:Q_PNP_BCE"
bhdl  = "BJT"
pin_map = { "1" = "B", "2" = "C", "3" = "E" }

[[mapping]]
kicad = "Device:Q_PNP_BEC"
bhdl  = "BJT"
pin_map = { "1" = "B", "2" = "E", "3" = "C" }

# ─── Test points ───────────────────────────────────────────────────

[[mapping]]
kicad = "Connector:TestPoint"
bhdl  = "TestPoint"
pin_map = { "1" = "K" }

[[mapping]]
kicad = "Connector:TestPoint_2Pin"
bhdl  = "TestPoint"

# ─── Power flags (handled specially) ───────────────────────────────
# These aren't instantiable components — the importer treats them
# as net-naming hints that synthesise `power`/`ground` declarations.

[[mapping]]
kicad = "power:GND"
bhdl  = "_net:GND"

[[mapping]]
kicad = "power:Earth"
bhdl  = "_net:GND"

[[mapping]]
kicad = "power:+5V"
bhdl  = "_net:VCC_5V"

[[mapping]]
kicad = "power:+3V3"
bhdl  = "_net:VCC_3V3"

[[mapping]]
kicad = "power:+3.3V"
bhdl  = "_net:VCC_3V3"

[[mapping]]
kicad = "power:+12V"
bhdl  = "_net:VCC_12V"

[[mapping]]
kicad = "power:-12V"
bhdl  = "_net:VEE_12V"

[[mapping]]
kicad = "power:VCC"
bhdl  = "_net:VCC"

[[mapping]]
kicad = "power:VDD"
bhdl  = "_net:VDD"

[[mapping]]
kicad = "power:VEE"
bhdl  = "_net:VEE"

[[mapping]]
kicad = "power:VBUS"
bhdl  = "_net:VBUS"

[[mapping]]
kicad = "power:PWR_FLAG"
bhdl  = "_net:_pwr_flag"

# ─── Mechanical / no-op symbols ────────────────────────────────────
# Fiducials, mounting holes, and similar mechanical markers have
# no electrical role. The importer still records them so footprint
# information survives, but they map to passthrough entities (zero
# pins) which the analyzer ignores during ERC.

[[mapping]]
kicad = "Mechanical:Fiducial"
bhdl  = "kicad_passthrough"

[[mapping]]
kicad = "Mechanical:MountingHole"
bhdl  = "kicad_passthrough"

[[mapping]]
kicad = "Mechanical:MountingHole_Pad"
bhdl  = "kicad_passthrough"

