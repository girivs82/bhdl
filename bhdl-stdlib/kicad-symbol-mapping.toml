bhdl  = "_net:_pwr_flag"

# ─── Mechanical / no-op symbols ────────────────────────────────────
# Fiducials, mounting holes, and similar mechanical markers have
# no electrical role. The importer still records them so footprint
# information survives, but they map to passthrough entities (zero
# pins) which the analyzer ignores during ERC.

[[mapping]]
kicad = "Mechanical:Fiducial"
bhdl  = "Fiducial"
[mapping.pin_map]
"1" = "K"

[[mapping]]
kicad = "Mechanical:MountingHole"
bhdl  = "kicad_passthrough"

[[mapping]]
kicad = "Mechanical:MountingHole_Pad"
bhdl  = "kicad_passthrough"

