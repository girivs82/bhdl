bhdl  = "_net:VCC_12V"

[[mapping]]
kicad = "power:-12V"
bhdl  = "_net:VEE_12V"

[[mapping]]
kicad = "power:VCC"
bhdl  = "_net:VCC"

[[mapping]]
kicad = "power:VDD"
bhdl  = "_net:VDD"

[[mapping]]
kicad = "power:VEE"
bhdl  = "_net:VEE"

[[mapping]]
