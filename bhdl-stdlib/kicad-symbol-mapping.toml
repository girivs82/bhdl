# KiCad → BHDL symbol mapping registry.
#
# Phase B/G of the KiCad-to-BHDL translator (see
# docs/plan/KiCad_Import_And_Stdlib_Accretion.md). Each `[mapping]`
# block tells the importer: when you see a `(symbol (lib_id "X:Y") ...)`
# in a KiCad schematic, instantiate the named BHDL entity instead,
# and bind the schematic pins to the BHDL entity pins via the
# `pin_map`.
#
# Discipline:
#   - Only list mappings whose `bhdl` target is a real entity
#     already in `bhdl-stdlib`. Mappings to non-existent entities
#     produce un-parseable .bhdl on import.
#   - When stdlib gains a new entity (e.g. a generic Connector
#     family), add the relevant KiCad lib_ids in the same commit.
#   - Unmapped symbols fall through to `kicad_passthrough` (defined
#     in `bhdl-stdlib/kicad_passthrough.bhdl`); the import never
#     fails outright on an unknown part.
#
# `pin_map` translates KiCad pin numbers → BHDL port names. When
# the BHDL entity declares numeric pins (`pin 1:`, `pin 2:`), the
# default identity mapping is correct and pin_map can be omitted.
#
# Power-flag symbols (`power:GND`, `power:+5V`, …) use the
# special `_net:<NAME>` target form, meaning "this isn't an entity,
# it names a power net at this point in the schematic". The
# importer recognises the prefix and produces `power VCC_5V = 5V;`
# / `ground GND;` declarations rather than entity instances.

# ─── Passives (Device library) ─────────────────────────────────────
# All resolve to existing entities in bhdl-stdlib/passives/. KiCad
# pin numbers 1/2 line up with BHDL's pin 1/pin 2 declarations.

[[mapping]]
kicad = "Device:R"
bhdl  = "Resistor"

[[mapping]]
kicad = "Device:R_Small"
bhdl  = "Resistor"

[[mapping]]
kicad = "Device:R_US"
bhdl  = "Resistor"

[[mapping]]
kicad = "Device:C"
bhdl  = "Capacitor"

[[mapping]]
kicad = "Device:C_Small"
bhdl  = "Capacitor"

[[mapping]]
kicad = "Device:C_Polarized"
bhdl  = "Capacitor"

[[mapping]]
kicad = "Device:L"
bhdl  = "Inductor"

[[mapping]]
kicad = "Device:L_Small"
bhdl  = "Inductor"

[[mapping]]
kicad = "Device:LED"
bhdl  = "LED"
pin_map = { "1" = "K", "2" = "A" }

[[mapping]]
kicad = "Device:LED_Small"
bhdl  = "LED"
pin_map = { "1" = "K", "2" = "A" }

[[mapping]]
kicad = "Device:D"
bhdl  = "Diode"
pin_map = { "1" = "K", "2" = "A" }

[[mapping]]
kicad = "Device:D_Small"
bhdl  = "Diode"
pin_map = { "1" = "K", "2" = "A" }

[[mapping]]
kicad = "Device:D_Zener"
bhdl  = "Diode"
pin_map = { "1" = "K", "2" = "A" }

[[mapping]]
kicad = "Device:D_Zener_Small"
bhdl  = "Diode"
pin_map = { "1" = "K", "2" = "A" }

[[mapping]]
kicad = "Device:Fuse"
bhdl  = "Fuse"
[mapping.pin_map]
"1" = "A"
"2" = "B"

[[mapping]]
kicad = "Device:Polyfuse"
bhdl  = "Fuse"

# Ferrite bead: KiCad ships two spellings of the lib_id depending
# on which library is loaded (`Ferrite_Bead` in older libraries,
# `FerriteBead` in current KiCad 8). Map both to the same entity.
[[mapping]]
kicad = "Device:FerriteBead"
bhdl  = "Bead"
[mapping.pin_map]
"1" = "A"
"2" = "B"

[[mapping]]
kicad = "Device:Ferrite_Bead"
bhdl  = "Bead"
[mapping.pin_map]
"1" = "A"
"2" = "B"

# ─── Protection diodes ─────────────────────────────────────────────

[[mapping]]
kicad = "Diode:1.5KE6V8CA"
bhdl  = "TVSDiode"

[[mapping]]
kicad = "Diode:SMAJ5.0CA"
bhdl  = "TVSDiode"

[[mapping]]
kicad = "Diode:SS34"
bhdl  = "SchottkyDiode"

[[mapping]]
kicad = "Device:D_Schottky"
bhdl  = "SchottkyDiode"

[[mapping]]
kicad = "Device:D_Schottky_Small"
bhdl  = "SchottkyDiode"

# ─── Transistors ───────────────────────────────────────────────────
# BHDL's MOSFET entity takes a `part` string parameter; the
# importer passes the KiCad Value field through, so N vs P channel
# information rides on the part number (e.g. "BSS138", "AO3401").
# All G/D/S pin permutations KiCad uses map to the same entity —
# the entity itself uses datasheet pin names.

[[mapping]]
kicad = "Device:Q_NMOS_GDS"
bhdl  = "MOSFET"
pin_map = { "1" = "G", "2" = "D", "3" = "S" }

[[mapping]]
kicad = "Device:Q_NMOS_DGS"
bhdl  = "MOSFET"
pin_map = { "1" = "D", "2" = "G", "3" = "S" }

[[mapping]]
kicad = "Device:Q_NMOS_GSD"
bhdl  = "MOSFET"
pin_map = { "1" = "G", "2" = "S", "3" = "D" }

[[mapping]]
kicad = "Device:Q_PMOS_GDS"
bhdl  = "MOSFET"
pin_map = { "1" = "G", "2" = "D", "3" = "S" }

[[mapping]]
kicad = "Device:Q_PMOS_DGS"
bhdl  = "MOSFET"
pin_map = { "1" = "D", "2" = "G", "3" = "S" }

[[mapping]]
kicad = "Device:Q_PMOS_GSD"
bhdl  = "MOSFET"
pin_map = { "1" = "G", "2" = "S", "3" = "D" }

# Similarly for BJTs (BHDL entity uses datasheet pin names B/C/E
# and `part` carries the actual transistor model number).

[[mapping]]
kicad = "Device:Q_NPN_BCE"
bhdl  = "BJT"
pin_map = { "1" = "B", "2" = "C", "3" = "E" }

[[mapping]]
kicad = "Device:Q_NPN_BEC"
bhdl  = "BJT"
pin_map = { "1" = "B", "2" = "E", "3" = "C" }

[[mapping]]
kicad = "Device:Q_NPN_CBE"
bhdl  = "BJT"
pin_map = { "1" = "C", "2" = "B", "3" = "E" }

[[mapping]]
kicad = "Device:Q_PNP_BCE"
bhdl  = "BJT"
pin_map = { "1" = "B", "2" = "C", "3" = "E" }

[[mapping]]
kicad = "Device:Q_PNP_BEC"
bhdl  = "BJT"
pin_map = { "1" = "B", "2" = "E", "3" = "C" }

# ─── Microcontrollers (typed entities replacing passthroughs) ─────
# ATmega328P DIP-28 (used by Arduino UNO). The schematic's KiCad
# pin numbers (1..28) translate to descriptive port names per the
# AVR datasheet (PB0..PB7, PC0..PC6, PD0..PD7, plus power/reset).

[[mapping]]
kicad = "Arduino UNO:ATMEGA328P-PU"
bhdl  = "ATmega328P_DIP28"
# Sub-table form is the only multi-line option for HashMap-typed
# fields in TOML. Pin mapping follows the ATmega328P DIP-28
# datasheet: pin 1 = RESET (PC6), pins 7/20 = VCC/AVCC, pins
# 8/22 = digital/analog GND, etc. Comments below match the
# pin-name annotations in `bhdl-stdlib/actives/atmega328p.bhdl`.
[mapping.pin_map]
"1"  = "PC6"      # RESET
"2"  = "PD0"      # RXD
"3"  = "PD1"      # TXD
"4"  = "PD2"      # INT0
"5"  = "PD3"      # INT1 / OC2B
"6"  = "PD4"      # T0 / XCK
"7"  = "VCC"
"8"  = "GND1"     # digital ground
"9"  = "PB6"      # XTAL1 / TOSC1
"10" = "PB7"      # XTAL2 / TOSC2
"11" = "PD5"      # T1 / OC0B
"12" = "PD6"      # OC0A / AIN0
"13" = "PD7"      # AIN1
"14" = "PB0"      # ICP1 / CLKO
"15" = "PB1"      # OC1A
"16" = "PB2"      # SS / OC1B
"17" = "PB3"      # MOSI / OC2A
"18" = "PB4"      # MISO
"19" = "PB5"      # SCK
"20" = "AVCC"
"21" = "AREF"
"22" = "GND2"     # analog ground
"23" = "PC0"      # ADC0
"24" = "PC1"      # ADC1
"25" = "PC2"      # ADC2
"26" = "PC3"      # ADC3
"27" = "PC4"      # ADC4 / SDA
"28" = "PC5"      # ADC5 / SCL

# ATmega328P QFN-32 / MLF-32 (used by Arduino Nano). Same MCU
# silicon as the DIP-28 above, leadless package with two extra
# ADC inputs (ADC6/ADC7) and duplicate VCC/GND pads.

[[mapping]]
kicad = "Arduino Nano:ATMEGA328P-MU"
bhdl  = "ATmega328P_QFN32"
[mapping.pin_map]
"1"  = "PD3"      # INT1 / OC2B
"2"  = "PD4"      # T0 / XCK
"3"  = "GND1"
"4"  = "VCC1"
"5"  = "GND2"
"6"  = "VCC2"
"7"  = "PB6"      # XTAL1 / TOSC1
"8"  = "PB7"      # XTAL2 / TOSC2
"9"  = "PD5"      # T1 / OC0B
"10" = "PD6"      # OC0A / AIN0
"11" = "PD7"      # AIN1
"12" = "PB0"      # ICP1 / CLKO
"13" = "PB1"      # OC1A
"14" = "PB2"      # SS / OC1B
"15" = "PB3"      # MOSI / OC2A
"16" = "PB4"      # MISO
"17" = "PB5"      # SCK
"18" = "AVCC"
"19" = "ADC6"     # QFN-only ADC channel
"20" = "AREF"
"21" = "GND3"     # analog ground
"22" = "ADC7"     # QFN-only ADC channel
"23" = "PC0"      # ADC0
"24" = "PC1"      # ADC1
"25" = "PC2"      # ADC2
"26" = "PC3"      # ADC3
"27" = "PC4"      # ADC4 / SDA
"28" = "PC5"      # ADC5 / SCL
"29" = "PC6"      # RESET
"30" = "PD0"      # RXD
"31" = "PD1"      # TXD
"32" = "PD2"      # INT0
"33" = "PAD"      # Exposed thermal pad on QFN bottom

