# KiCad → BHDL symbol mapping registry.
#
# Phase B of the KiCad-to-BHDL translator (see
# docs/plan/KiCad_Import_And_Stdlib_Accretion.md). Each `[mapping]`
# block tells the importer: when you see a `(symbol (lib_id "X:Y") ...)`
# in a KiCad schematic, instantiate the named BHDL entity instead,
# and bind the schematic pins to the BHDL entity pins via the
# `pin_map`.
#
# A `pin_map` of `"1" = "p"` means "KiCad pin number 1 wires to BHDL
# port `p`". For passives and connectors the names are usually
# trivial (1↔p, 2↔n); for ICs the map captures the named-pin
# convention.
#
# Entries with no `pin_map` default to identity mapping (the KiCad
# pin name IS the BHDL port name) — useful for ICs whose .bhdl
# stdlib entity already mirrors the datasheet pin names.
#
# Unmapped symbols fall through to a `kicad_passthrough` entity
# (an opaque component carrying only the netlist footprint), so the
# importer never fails outright on unknown parts — it just produces
# weaker BHDL.

# ─── Passives (Device library) ─────────────────────────────────────

[[mapping]]
kicad = "Device:R"
bhdl  = "resistor"
pin_map = { "1" = "p", "2" = "n" }

[[mapping]]
kicad = "Device:R_Small"
bhdl  = "resistor"
pin_map = { "1" = "p", "2" = "n" }

