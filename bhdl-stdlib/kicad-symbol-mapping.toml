# ─── Power flags ───────────────────────────────────────────────────
#
# Power symbols in KiCad are "labels" that name a net (+5V, GND,
# +3V3, etc.) rather than physical parts. The importer handles them
# specially — they become net-naming hints, not entity instances.
# These mappings exist for completeness and to suppress
# "unknown symbol" warnings.

[[mapping]]
kicad = "power:GND"
bhdl  = "_net:GND"

[[mapping]]
kicad = "power:+5V"
bhdl  = "_net:VCC_5V"

[[mapping]]
kicad = "power:+3V3"
bhdl  = "_net:VCC_3V3"

[[mapping]]
kicad = "power:+3.3V"
bhdl  = "_net:VCC_3V3"

[[mapping]]
kicad = "power:VCC"
bhdl  = "_net:VCC"

[[mapping]]
kicad = "power:VDD"
bhdl  = "_net:VDD"

[[mapping]]
kicad = "power:VEE"
bhdl  = "_net:VEE"

[[mapping]]
kicad = "power:+12V"
bhdl  = "_net:VCC_12V"

[[mapping]]
kicad = "power:-12V"
bhdl  = "_net:VEE_12V"

[[mapping]]
kicad = "power:Earth"
bhdl  = "_net:EARTH"

[[mapping]]
kicad = "power:PWR_FLAG"
bhdl  = "_net:_pwr_flag"
