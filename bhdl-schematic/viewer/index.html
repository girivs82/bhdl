<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHDL Schematic Viewer</title>
<style>
:root {
    --bg: #1e1e1e;
    --toolbar-bg: #252526;
    --toolbar-border: #3c3c3c;
    --text: #d4d4d4;
    --text-dim: #888;
    --btn-bg: #3c3c3c;
    --btn-hover: #505050;
    --accent: #4fc3f7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    font-size: 13px;
}
body {
    display: flex;
    flex-direction: column;
}
#toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 12px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--toolbar-border);
    flex-shrink: 0;
    height: 32px;
}
#entity-name {
    font-weight: bold;
    color: var(--accent);
    font-size: 13px;
}
#stats {
    color: var(--text-dim);
    font-size: 11px;
}
.spacer { flex: 1; }
.toolbar-btn {
    background: var(--btn-bg);
    color: var(--text);
    border: none;
    border-radius: 3px;
    padding: 2px 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: monospace;
    line-height: 20px;
}
.toolbar-btn:hover { background: var(--btn-hover); }
#schematic-canvas {
    flex: 1;
    display: block;
    width: 100%;
    cursor: default;
}
</style>
</head>
<body>
<div id="toolbar">
    <span id="entity-name">No entity</span>
    <span id="stats"></span>
    <span class="spacer"></span>
    <button id="btn-zoom-in" class="toolbar-btn" title="Zoom In">+</button>
    <button id="btn-zoom-out" class="toolbar-btn" title="Zoom Out">-</button>
    <button id="btn-zoom-fit" class="toolbar-btn" title="Fit to View">Fit</button>
    <label style="display:flex;align-items:center;gap:4px;color:var(--text-dim);font-size:11px;cursor:pointer;margin-left:8px">
        <input type="checkbox" id="chk-debug"> Debug
    </label>
</div>
<pre id="debug-panel" style="display:none;position:fixed;top:32px;left:0;right:0;background:rgba(30,30,30,0.95);color:#d4d4d4;z-index:9999;font:11px/1.4 monospace;padding:8px 12px;max-height:50vh;overflow:auto;border-bottom:1px solid #4fc3f7;white-space:pre;"></pre>
<canvas id="schematic-canvas"></canvas>

<!-- Embedded schematic data (replaced at build time) -->
<script>
window.__BHDL_SCHEMATIC_DATA__ = {{SCHEMATIC_DATA}};
</script>

<!-- MIT licensed: BHDL Schematic Viewer -->
<script id="bhdl-schematic">{{SCHEMATIC_SCRIPT}}</script>
</body>
</html>
