[package]
name = "bhdl-lsp"
license.workspace = true
version = "0.1.0"
edition = "2021"

[dependencies]
# BHDL toolchain
bhdl-parser = { path = "../bhdl-parser" }
bhdl-ast = { path = "../bhdl-ast" }
bhdl-analyzer = { path = "../bhdl-analyzer" }
bhdl-common = { path = "../bhdl-common" }
bhdl-stdlib = { path = "../bhdl-stdlib" }
bhdl-schematic = { path = "../bhdl-schematic" }
bhdl-synthesizer = { path = "../bhdl-synthesizer" }
bhdl-netlist = { path = "../bhdl-netlist" }

# LSP framework
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# For rowan AST access
rowan = "0.15"

[[bin]]
name = "bhdl-lsp"
path = "src/main.rs"
