[package]
name = "bhdl-jlcparts-provider"
version = "0.1.0"
edition = "2021"
description = "BHDL supply-chain provider — resolves parametric passives to real LCSC/JLCPCB parts from an offline jlcparts SQLite catalogue. Zero runtime dependencies (SQLite statically linked)."

[[bin]]
name = "bhdl-jlcparts-provider"
path = "src/main.rs"

[dependencies]
# `bundled` statically links SQLite into the binary — no system libsqlite3,
# no Python, no interpreter. A single self-contained executable.
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
