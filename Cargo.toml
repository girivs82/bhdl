# This file defines the workspace for BHDL tooling.

[workspace]
members = [
    "bhdl-parser",
    "bhdl-analyzer",
    "bhdl-netlist",
    "bhdl-synthesizer",
    "bhdl-cli",
    "bhdl-lsp",
]

# Use the latest resolver for better dependency management.
resolver = "2"

