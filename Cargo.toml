# This file defines the workspace for BHDL tooling.

[workspace]
members = [
    "bhdl-parser",
    "bhdl-netlist",
    "bhdl-synthesizer",
    "bhdl-cli",
    "bhdl-lsp", "bhdl-ast", "bhdl-analyzer", "bhdl-visualizer", "bhdl-components", "bhdl-common", "bhdl-spice", "bhdl-stdlib", "bhdl-safety", "bhdl-sim", "bhdl-testbench",
]

# Use the latest resolver for better dependency management.
resolver = "2"

