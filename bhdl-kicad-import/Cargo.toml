[package]
name = "bhdl-kicad-import"
version = "0.1.0"
edition = "2021"
description = "Read KiCad 6+ schematic files into a typed IR. Phase A of the KiCad-to-BHDL translator pipeline (see docs/plan/KiCad_Import_And_Stdlib_Accretion.md)."

[dependencies]
# No external S-expression crate by design — KiCad's S-expr is a
# well-defined subset and a custom recursive-descent parser is
# ~200 lines, easier to debug, and pins zero dependencies on a
# format that occasionally evolves between KiCad versions.
thiserror = "1.0"
# For the kicad-symbol-mapping.toml registry that maps KiCad
# library symbols (e.g. "Device:R") to BHDL stdlib entities.
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# Phase H: round-trip BHDL through the synthesizer and compare its
# resulting netlist against the canonical netlist extracted from
# the KiCad side. Dev-dep (not lib-dep) so bhdl-kicad-import stays
# lightweight for callers who only need the importer; the round-
# trip integration lives in tests/.
bhdl-parser      = { path = "../bhdl-parser" }
bhdl-ast         = { path = "../bhdl-ast" }
bhdl-analyzer    = { path = "../bhdl-analyzer" }
bhdl-synthesizer = { path = "../bhdl-synthesizer" }
bhdl-netlist     = { path = "../bhdl-netlist" }
tokio = { version = "1.0", features = ["sync", "time", "macros", "rt-multi-thread"] }
