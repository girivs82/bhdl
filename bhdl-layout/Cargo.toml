[package]
name = "bhdl-layout"
version = "0.1.0"
edition = "2021"

[dependencies]
bhdl-netlist = { path = "../bhdl-netlist" }
bhdl-analyzer = { path = "../bhdl-analyzer" }
bhdl-ast = { path = "../bhdl-ast" }
bhdl-parser = { path = "../bhdl-parser" }
bhdl-synthesizer = { path = "../bhdl-synthesizer" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
tokio = { version = "1.35", features = ["full"] }

[[bin]]
name = "test_ai_layout"
path = "src/bin/test_ai_layout.rs"