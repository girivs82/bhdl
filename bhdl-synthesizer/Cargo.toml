[package]
name = "bhdl-synthesizer"
version = "0.1.0"
edition = "2021"
description = "BHDL synthesizer - converts semantic analysis to netlists with preserved context"
# `src/bin/` contains 75 historical test/demo binaries (test_7805_realistic.rs,
# test_buck_regulator_spice_roles.rs, …). With Cargo's auto-discovery enabled,
# every `cargo build -p bhdl-synthesizer` compiled all 75 of them — a several-
# minute tax on every developer iteration. We disable auto-binary discovery
# and explicitly opt the one we actually use (`end_to_end_test`) back in.
# To revive a specific demo, add another `[[bin]]` block below.
autobins = false

[[bin]]
name = "end_to_end_test"
path = "src/bin/end_to_end_test.rs"

[[bin]]
name = "test_interface_bundle"
path = "src/bin/test_interface_bundle.rs"

[[bin]]
name = "test_interface_bound"
path = "src/bin/test_interface_bound.rs"

[[bin]]
name = "test_interface_direction"
path = "src/bin/test_interface_direction.rs"

[[bin]]
name = "test_interface_conflict"
path = "src/bin/test_interface_conflict.rs"

[[bin]]
name = "test_atmega328p_pinmux"
path = "src/bin/test_atmega328p_pinmux.rs"

[[bin]]
name = "test_interface_v07_bundle"
path = "src/bin/test_interface_v07_bundle.rs"

[[bin]]
name = "test_interface_uart_cross"
path = "src/bin/test_interface_uart_cross.rs"

[[bin]]
name = "test_arduino_uart_bridge"
path = "src/bin/test_arduino_uart_bridge.rs"

[[bin]]
name = "test_atmega328p_decoupling"
path = "src/bin/test_atmega328p_decoupling.rs"

[[bin]]
name = "test_lm317_5v"
path = "src/bin/test_lm317_5v.rs"

[[bin]]
name = "test_conditional_expansion"
path = "src/bin/test_conditional_expansion.rs"

[[bin]]
name = "test_arduino_class_board"
path = "src/bin/test_arduino_class_board.rs"

[[bin]]
name = "test_stm32_blue_pill"
path = "src/bin/test_stm32_blue_pill.rs"

[[bin]]
name = "test_stm32_variant_sku"
path = "src/bin/test_stm32_variant_sku.rs"

[[bin]]
name = "test_gpio_aliases"
path = "src/bin/test_gpio_aliases.rs"

[[bin]]
name = "test_abstract_resolver"
path = "src/bin/test_abstract_resolver.rs"

[[bin]]
name = "test_subinterface_synth"
path = "src/bin/test_subinterface_synth.rs"

[[bin]]
name = "test_parametric_iface"
path = "src/bin/test_parametric_iface.rs"

[[bin]]
name = "test_iface_constraints"
path = "src/bin/test_iface_constraints.rs"

[[bin]]
name = "test_swizzle_via_generate"
path = "src/bin/test_swizzle_via_generate.rs"

