# [[bin]]
# name = "test_unified_svg"
# path = "../test_unified_svg.rs"

[dependencies]
bhdl-analyzer = { path = "../bhdl-analyzer" }
bhdl-netlist = { path = "../bhdl-netlist" }
bhdl-ast = { path = "../bhdl-ast" }
bhdl-parser = { path = "../bhdl-parser" }
bhdl-components = { path = "../bhdl-components" }
bhdl-common = { path = "../bhdl-common" }
bhdl-stdlib = { path = "../bhdl-stdlib" }
bhdl-safety = { path = "../bhdl-safety" }
bhdl-spice = { path = "../bhdl-spice" }
bhdl-schematic = { path = "../bhdl-schematic" }
bhdl-simulation = { path = "../bhdl-simulation" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
console = "0.15"
rowan = "0.15"
tokio = { version = "1.0", features = ["sync", "time", "macros", "rt-multi-thread"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
# Rhai — embedded scripting for vendor `design { }` body hooks (Stage 5).
# Statically linked into bhdl-synthesizer so there is no user-managed
# runtime: zero install, zero venv, deterministic across machines.
# Sandboxed by default (no I/O, no module imports unless we register
# host functions); fuel-limited via set_max_operations.
rhai = { version = "1.18", default-features = false, features = ["std", "sync"] }

# Dropped during the 2026-05-26 build-speed audit (Phase J followup):
#   - ndarray         — 0 uses anywhere in src
#   - uuid            — 0 uses
#   - slotmap         — 0 direct uses (still pulled transitively via bhdl-netlist)
#   - futures-util    — single use in src/bin/test_interface_synthesis_runner.rs,
#                        which now sits in the autobins=false disabled set
#   - chrono          — single Utc::now().to_rfc3339() call inlined to
#                        std::time::SystemTime + manual ISO-8601 format
# Together these were dragging ~3-5 minutes off clean-build time.

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "test_layout_intent_thread"
path = "src/bin/test_layout_intent_thread.rs"
