<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs><style type="text/css"><![CDATA[
.component { fill: white; stroke: black; stroke-width: 1.5; }
.component-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: black; }
.pin { fill: none; stroke: red; stroke-width: 1; }
.pin-label { font-family: Arial, sans-serif; font-size: 6px; fill: black; }
.pin-number { font-family: Arial, sans-serif; font-size: 5px; fill: #666; }
.pin-name { font-family: Arial, sans-serif; font-size: 6px; fill: black; }
.net { fill: none; stroke: blue; stroke-width: 1.2; }
.net-power { fill: none; stroke: #c00; stroke-width: 2.5; }
.net-ground { fill: none; stroke: #000; stroke-width: 2.0; }
.net-label { font-family: Arial, sans-serif; font-size: 8px; fill: blue; }
.grid { stroke: #f0f0f0; stroke-width: 0.5; opacity: 0.5; }
]]></style></defs>
<line x1="0" y1="0" x2="0" y2="100" class="grid"/>
<line x1="20" y1="0" x2="20" y2="100" class="grid"/>
<line x1="40" y1="0" x2="40" y2="100" class="grid"/>
<line x1="60" y1="0" x2="60" y2="100" class="grid"/>
<line x1="80" y1="0" x2="80" y2="100" class="grid"/>
<line x1="100" y1="0" x2="100" y2="100" class="grid"/>
<line x1="0" y1="0" x2="100" y2="0" class="grid"/>
<line x1="0" y1="20" x2="100" y2="20" class="grid"/>
<line x1="0" y1="40" x2="100" y2="40" class="grid"/>
<line x1="0" y1="60" x2="100" y2="60" class="grid"/>
<line x1="0" y1="80" x2="100" y2="80" class="grid"/>
<line x1="0" y1="100" x2="100" y2="100" class="grid"/>
</svg>
