[package]
name = "bhdl-analyzer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "test_import_processing"
path = "src/bin/test_import_processing.rs"

[[bin]]
name = "test_documentation_generation"
path = "src/bin/test_documentation_generation.rs"

[[bin]]
name = "test_fpga_comprehensive"
path = "src/bin/test_fpga_comprehensive.rs"

[[bin]]
name = "test_multi_voltage_integration"
path = "src/bin/test_multi_voltage_integration.rs"

[dependencies]
bhdl-parser = { path = "../bhdl-parser" }
bhdl-ast = { path = "../bhdl-ast" }
bhdl-netlist = { path = "../bhdl-netlist" }
bhdl-common = { path = "../bhdl-common" }
bhdl-components = { path = "../bhdl-components" }
bhdl-stdlib = { path = "../bhdl-stdlib" }
rowan = "0.15.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
bincode = "1.3"
md5 = "0.7"
anyhow = "1.0"
log = "0.4"
tokio = { version = "1", features = ["rt", "macros"] }
env_logger = "0.10"
chrono = "0.4"
