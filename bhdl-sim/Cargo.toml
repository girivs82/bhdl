[package]
name = "bhdl-sim"
version = "0.1.0"
edition = "2021"
authors = ["BHDL Team"]
description = "Behavioral simulation engine for BHDL"
license = "MIT OR Apache-2.0"

[dependencies]
bhdl-ast = { path = "../bhdl-ast" }
bhdl-analyzer = { path = "../bhdl-analyzer" }
bhdl-netlist = { path = "../bhdl-netlist" }
bhdl-common = { path = "../bhdl-common" }

# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

# Data structures
indexmap = "2.0"
slotmap = "1.0"

# Async/concurrency
tokio = { version = "1.0", features = ["full"] }
crossbeam-channel = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = "0.4"

[dev-dependencies]
insta = "1.40"
pretty_assertions = "1.4"
criterion = "0.5"
