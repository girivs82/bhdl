[package]
name = "bhdl-simulation"
version = "0.1.0"
edition = "2021"
authors = ["BHDL Contributors"]
description = "Simulation infrastructure for BHDL including testbench support and waveform capture"
license = "MIT OR Apache-2.0"

[dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
rowan = "0.15"

# BHDL dependencies
bhdl-ast = { path = "../bhdl-ast" }
bhdl-parser = { path = "../bhdl-parser" }
bhdl-netlist = { path = "../bhdl-netlist" }
bhdl-spice = { path = "../bhdl-spice" }
bhdl-analyzer = { path = "../bhdl-analyzer" }
bhdl-common = { path = "../bhdl-common" }

# Data structures
petgraph = "0.6"
nalgebra = "0.33"
num-complex = "0.4"

# Time handling
chrono = "0.4"

# File formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Compression
flate2 = { version = "1.0", optional = true }
lz4 = { version = "1.0", optional = true }

# Collections
indexmap = "2.0"
dashmap = { version = "6.0", optional = true }
lru = "0.12"

# Parallel processing
rayon = { version = "1.7", optional = true }
crossbeam-channel = "0.5"

# Random number generation
rand = "0.8"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"
approx = "0.5"

[features]
default = ["parallel", "compression"]
parallel = ["rayon", "dashmap"]
compression = ["flate2", "lz4"]
fst-format = [] # Optional FST support